<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Clone HTML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Hide scrollbars for clean UI */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#313338] text-gray-200 overflow-hidden font-sans h-screen w-screen select-none">

    <div id="setup-screen" class="flex items-center justify-center h-screen w-screen bg-[#313338] absolute inset-0 z-50">
        <div class="bg-[#313338] p-8 rounded-lg shadow-2xl w-full max-w-md border border-gray-700">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold mb-2">Welcome to Web Chat</h1>
                <p class="text-gray-400 text-sm">Real-time WebSocket chat via pure HTML!</p>
            </div>
            <form id="setup-form">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-300 uppercase mb-2">
                        Display Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="username-input" class="w-full bg-[#1e1f22] border-none text-gray-200 rounded p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="What should we call you?" autofocus required>
                </div>
                <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded transition-colors">
                    Continue
                </button>
            </form>
        </div>
    </div>

    <div id="app-container" class="flex h-screen w-screen hidden">
        
        <!-- Error Banner -->
        <div id="error-banner" class="hidden absolute top-0 left-0 right-0 bg-red-500 text-white flex items-center justify-center py-2 px-4 z-50 shadow-md">
            <span id="error-text" class="flex-1 text-center text-sm font-medium"></span>
            <button onclick="hideError()" class="text-white hover:text-gray-200 font-bold ml-4"><i class="fas fa-times"></i></button>
        </div>

        <!-- Server Sidebar (Far Left) -->
        <div class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-3 flex-shrink-0 z-20">
            <div class="w-12 h-12 bg-indigo-500 text-white rounded-[16px] flex items-center justify-center cursor-pointer shadow-lg">
                <i class="fab fa-discord text-2xl"></i>
            </div>
            <div class="w-8 h-[2px] bg-[#313338] rounded-full"></div>
            <div class="w-12 h-12 bg-[#313338] hover:bg-green-500 text-green-500 hover:text-white rounded-[24px] hover:rounded-[16px] flex items-center justify-center cursor-pointer transition-all duration-300">
                <i class="fas fa-plus text-xl"></i>
            </div>
            <div class="w-12 h-12 bg-[#313338] hover:bg-green-500 text-green-500 hover:text-white rounded-[24px] hover:rounded-[16px] flex items-center justify-center cursor-pointer transition-all duration-300">
                <i class="fas fa-compass text-xl"></i>
            </div>
        </div>

        <!-- Channel Sidebar -->
        <div class="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0">
            <!-- Server Header -->
            <div id="server-name" class="h-12 border-b border-[#1f2023] shadow-sm flex items-center px-4 font-bold hover:bg-[#3f4147] cursor-pointer transition-colors truncate">
                Local Server
            </div>
            
            <!-- Channel List -->
            <div class="flex-1 overflow-y-auto p-2 scrollbar-hide">
                <div class="mt-4 mb-1">
                    <span class="text-xs font-semibold text-gray-400 uppercase px-2">Text Channels</span>
                </div>
                <div class="channel-btn active bg-[#3f4147] text-white flex items-center px-2 py-1.5 mx-2 rounded cursor-pointer mb-0.5" onclick="switchChannel('general', 'text')">
                    <i class="fas fa-hashtag text-gray-400 w-5"></i> <span class="font-medium">general</span>
                </div>
                <div class="channel-btn text-gray-400 hover:bg-[#3f4147] hover:text-gray-200 flex items-center px-2 py-1.5 mx-2 rounded cursor-pointer mb-0.5" onclick="switchChannel('random', 'text')">
                    <i class="fas fa-hashtag text-gray-400 w-5"></i> <span class="font-medium">random</span>
                </div>
                
                <div class="mt-6 mb-1">
                    <span class="text-xs font-semibold text-gray-400 uppercase px-2">Voice Channels</span>
                </div>
                <div class="channel-btn text-gray-400 hover:bg-[#3f4147] hover:text-gray-200 flex items-center px-2 py-1.5 mx-2 rounded cursor-pointer mb-0.5" onclick="switchChannel('Lounge', 'voice')">
                    <i class="fas fa-volume-up text-gray-400 w-5"></i> <span class="font-medium">Lounge</span>
                </div>
            </div>

            <!-- Current User Panel -->
            <div class="h-[52px] bg-[#232428] flex items-center px-2 space-x-2 flex-shrink-0">
                <div id="my-avatar" class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white cursor-pointer bg-indigo-500">?</div>
                <div class="flex-1 min-w-0">
                    <div id="my-username" class="text-sm font-semibold truncate leading-tight">User</div>
                    <div id="connection-status" class="text-xs text-yellow-500 truncate leading-tight">Connecting...</div>
                </div>
                <div class="flex space-x-1">
                    <button onclick="toggleMic()" class="p-1.5 hover:bg-[#3f4147] rounded text-gray-400 hover:text-gray-200">
                        <i id="mic-icon-mini" class="fas fa-microphone"></i>
                    </button>
                    <button class="p-1.5 hover:bg-[#3f4147] rounded text-gray-400 hover:text-gray-200">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="text-chat-area" class="flex-1 flex flex-col min-w-0 bg-[#313338]">
            <!-- Chat Header -->
            <div class="h-12 border-b border-[#1f2023] flex items-center px-4 shadow-sm flex-shrink-0 justify-between">
                <div class="flex items-center text-white font-semibold">
                    <i class="fas fa-hashtag text-gray-400 mr-2"></i>
                    <span id="current-channel-name">general</span>
                </div>
                <button onclick="clearCache()" class="text-gray-400 hover:text-red-400 text-xs px-2 py-1 rounded bg-[#2b2d31] transition-colors">
                    <i class="fas fa-trash-alt mr-1"></i> Clear Cache
                </button>
            </div>

            <!-- Messages List -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 select-text">
                <div class="mt-4 mb-8">
                    <div class="w-16 h-16 bg-[#4752c4] rounded-full flex items-center justify-center mb-4 text-white">
                        <i class="fas fa-hashtag text-3xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-white mb-2">Welcome to the channel!</h1>
                    <p class="text-gray-400">This is the start of the conversation.</p>
                </div>
                <!-- Messages injected here -->
            </div>

            <!-- Message Input -->
            <div class="px-4 pb-4 pt-2 flex-shrink-0">
                <form id="chat-form" class="bg-[#383a40] rounded-lg flex items-center px-4 py-2">
                    <i class="fas fa-plus-circle text-gray-400 hover:text-gray-200 cursor-pointer mr-4 text-xl"></i>
                    <input type="text" id="chat-input" class="flex-1 bg-transparent text-gray-200 placeholder-gray-500 focus:outline-none" placeholder="Message #general">
                    <button type="submit" class="ml-2 text-indigo-400 hover:text-indigo-300">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>

        <div id="voice-chat-area" class="flex-1 flex flex-col min-w-0 bg-black hidden">
            <div class="h-12 border-b border-[#1f2023] bg-[#313338] flex items-center px-4 shadow-sm flex-shrink-0">
                <div class="flex items-center text-white font-semibold">
                    <i class="fas fa-volume-up text-gray-400 mr-2"></i>
                    <span id="voice-channel-name">Lounge</span>
                </div>
            </div>
            
            <div class="flex-1 p-4 flex items-center justify-center relative bg-gray-900 overflow-hidden">
                <video id="screen-video" autoplay playsinline muted class="hidden max-h-full max-w-full rounded-lg shadow-lg border border-gray-800 object-contain"></video>
                <div id="voice-placeholder" class="flex flex-col items-center justify-center text-gray-400">
                    <div id="voice-avatar" class="w-32 h-32 rounded-full flex items-center justify-center font-bold text-white text-4xl mb-6 shadow-2xl bg-indigo-500">?</div>
                    <p class="text-xl font-medium text-white mb-2">Connected to Voice</p>
                    <p class="text-sm opacity-60">Share screen using controls below</p>
                </div>
            </div>

            <div class="h-20 bg-[#1e1f22] flex items-center justify-center space-x-6 px-4 pb-2 shrink-0">
                <button onclick="toggleMic()" id="btn-mic" class="p-4 rounded-full flex items-center justify-center transition-colors bg-[#313338] text-white hover:bg-[#3f4147]">
                    <i class="fas fa-microphone text-xl"></i>
                </button>
                <button onclick="toggleScreenShare()" id="btn-screen" class="p-4 rounded-full flex items-center justify-center transition-colors bg-[#313338] text-white hover:bg-[#3f4147]">
                    <i class="fas fa-desktop text-xl"></i>
                </button>
                <button onclick="switchChannel('general', 'text')" class="p-4 rounded-full flex items-center justify-center bg-red-500 hover:bg-red-600 text-white transition-colors">
                    <i class="fas fa-phone-slash text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Members Sidebar (Right) -->
        <div class="w-60 bg-[#2b2d31] hidden lg:flex flex-col flex-shrink-0 border-l border-[#1f2023]">
            <div class="p-4 flex-1 overflow-y-auto">
                <h3 class="text-xs font-semibold text-gray-400 uppercase mb-2">Online</h3>
                <div id="members-list" class="space-y-1">
                    <!-- Members injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        const PUBLIC_WS_URL = "wss://demo.piesocket.com/v3/discord_clone_global?api_key=VCXCEuvhGcBDP7XhiJJUDvR1e1D3eiVjgZ9VRiaV&notify_self=1";
        let profile = null;
        let ws = null;
        let messages = [];
        let members = [];
        let activeChannel = { name: 'general', type: 'text' };
        
        // Media State
        let micStream = null;
        let screenStream = null;
        let isMuted = false;
        let isScreenSharing = false;

        // URL Parameters
        const params = new URLSearchParams(window.location.search);
        const serverName = params.get('server') || 'Local HTML Server';
        const defaultChannel = params.get('channel') || 'general';
        const paramUsername = params.get('username') || '';

        // DOM Elements
        const setupScreen = document.getElementById('setup-screen');
        const appContainer = document.getElementById('app-container');
        const setupForm = document.getElementById('setup-form');
        const usernameInput = document.getElementById('username-input');
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const membersList = document.getElementById('members-list');
        const errorBanner = document.getElementById('error-banner');
        const errorText = document.getElementById('error-text');

        // Init
        document.getElementById('server-name').innerText = serverName;
        if (paramUsername) usernameInput.value = paramUsername;

        // Login Handler
        setupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = usernameInput.value.trim();
            if (!val) return;
            
            const color = `#${Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')}`;
            profile = {
                id: `user-${Date.now()}-${Math.floor(Math.random()*1000)}`,
                username: val,
                color: color
            };
            
            // Update UI
            document.getElementById('my-avatar').innerText = val.charAt(0).toUpperCase();
            document.getElementById('my-avatar').style.backgroundColor = color;
            document.getElementById('my-username').innerText = val;
            document.getElementById('voice-avatar').innerText = val.charAt(0).toUpperCase();
            document.getElementById('voice-avatar').style.backgroundColor = color;
            
            members.push(profile);
            
            setupScreen.classList.add('hidden');
            appContainer.classList.remove('hidden');
            
            initApp();
        });

        function connectWebSocket() {
            const statusEl = document.getElementById('connection-status');
            if (statusEl) {
                statusEl.innerText = "Connecting...";
                statusEl.className = "text-xs text-yellow-500 truncate leading-tight";
            }

            try {
                // Using an alternative cluster URL that is more stable
                ws = new WebSocket("wss://free.blr2.piesocket.com/v3/html_discord_clone?api_key=VCXCEuvhGcBDP7XhiJJUDvR1e1D3eiVjgZ9VRiaV&notify_self=1");
                
                ws.onopen = () => {
                    if (statusEl) {
                        statusEl.innerText = "Connected (Global)";
                        statusEl.className = "text-xs text-green-500 truncate leading-tight";
                    }
                    ws.send(JSON.stringify({ type: 'presence', profile }));
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'message') {
                        if (!messages.find(m => m.id === data.msg.id)) {
                            messages.push(data.msg);
                            if (messages.length > 100) messages.shift();
                            
                            try { localStorage.setItem('html-discord-messages', JSON.stringify(messages)); } 
                            catch (e) {}
                            
                            renderMessages();
                        }
                    } else if (data.type === 'presence') {
                        if (!members.find(m => m.id === data.profile.id)) {
                            members.push(data.profile);
                            renderMembers();
                        }
                    }
                };
                
                ws.onerror = () => {
                    console.warn("WebSocket connection error.");
                };

                ws.onclose = () => {
                    if (statusEl) {
                        statusEl.innerText = "Disconnected - Retrying";
                        statusEl.className = "text-xs text-red-500 truncate leading-tight";
                    }
                    // Auto-reconnect after 3 seconds
                    setTimeout(connectWebSocket, 3000); 
                };
            } catch (e) {
                showError("WebSockets blocked by browser sandbox.");
            }
        }

        function initApp() {
            // Load Cache
            try {
                const cached = localStorage.getItem('html-discord-messages');
                if (cached) {
                    messages = JSON.parse(cached);
                    renderMessages();
                }
            } catch (e) { console.warn('Local storage disabled'); }

            renderMembers();
            if (defaultChannel !== 'general') {
                switchChannel(defaultChannel, 'text'); // simplistic handling
            }

            // Connect WebSockets
            connectWebSocket();
        }

        // Send Message Handler
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text || !profile) return;

            const msg = {
                id: `msg-${Date.now()}-${Math.floor(Math.random()*1000)}`,
                text: text,
                senderId: profile.id,
                senderName: profile.username,
                senderColor: profile.color,
                timestamp: Date.now()
            };
            
            chatInput.value = '';
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'message', msg }));
                
                // Optimistically render it locally immediately
                if (!messages.find(m => m.id === msg.id)) {
                    messages.push(msg);
                    if (messages.length > 100) messages.shift();
                    try { localStorage.setItem('html-discord-messages', JSON.stringify(messages)); } catch (e) {}
                    renderMessages();
                }
            } else {
                // Offline Fallback: Render locally anyway so the UI doesn't feel broken
                showError("Offline mode: Message saved locally.");
                if (!messages.find(m => m.id === msg.id)) {
                    messages.push(msg);
                    if (messages.length > 100) messages.shift();
                    try { localStorage.setItem('html-discord-messages', JSON.stringify(messages)); } catch (e) {}
                    renderMessages();
                }
            }
        });

        function renderMessages() {
            // Keep the welcome message, clear the rest
            const welcomeHtml = `
                <div class="mt-4 mb-8">
                    <div class="w-16 h-16 bg-[#4752c4] rounded-full flex items-center justify-center mb-4 text-white">
                        <i class="fas fa-hashtag text-3xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-white mb-2">Welcome to #${activeChannel.name}!</h1>
                    <p class="text-gray-400">Share this page to chat with others in real-time.</p>
                </div>
            `;
            
            let html = welcomeHtml;
            
            messages.forEach((msg, index) => {
                const isConsecutive = index > 0 && messages[index - 1].senderId === msg.senderId && (msg.timestamp - messages[index - 1].timestamp) < 300000;
                const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                if (!isConsecutive) {
                    html += `
                        <div class="flex items-start mt-4 group">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white mr-4 mt-0.5 flex-shrink-0" style="background-color: ${msg.senderColor}">
                                ${msg.senderName.charAt(0).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-baseline">
                                    <span class="font-semibold text-indigo-400 hover:underline cursor-pointer mr-2">${msg.senderName}</span>
                                    <span class="text-xs text-gray-400 ml-2">${time}</span>
                                </div>
                                <div class="text-gray-200 break-words leading-relaxed whitespace-pre-wrap">${msg.text}</div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex items-start mt-1 group">
                            <div class="w-10 mr-4 flex-shrink-0 text-right opacity-0 group-hover:opacity-100">
                                <span class="text-[10px] text-gray-400 align-middle">${time}</span>
                            </div>
                            <div class="flex-1 min-w-0 text-gray-200 break-words leading-relaxed whitespace-pre-wrap">${msg.text}</div>
                        </div>
                    `;
                }
            });
            
            messagesContainer.innerHTML = html;
            setTimeout(() => {
                messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function renderMembers() {
            let html = '';
            members.forEach(member => {
                html += `
                    <div class="flex items-center px-2 py-1.5 hover:bg-[#3f4147] rounded cursor-pointer group">
                        <div class="relative">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white text-sm" style="background-color: ${member.color}">
                                ${member.username.charAt(0).toUpperCase()}
                            </div>
                            <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#2b2d31] rounded-full group-hover:border-[#3f4147]"></div>
                        </div>
                        <span class="ml-3 font-medium text-gray-300 group-hover:text-gray-100 truncate">
                            ${member.username} ${member.id === profile.id ? '(You)' : ''}
                        </span>
                    </div>
                `;
            });
            membersList.innerHTML = html;
        }

        function switchChannel(name, type) {
            activeChannel = { name, type };
            
            // Update sidebar UI
            document.querySelectorAll('.channel-btn').forEach(btn => {
                if(btn.innerText.includes(name)) {
                    btn.classList.add('bg-[#3f4147]', 'text-white');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('bg-[#3f4147]', 'text-white');
                    btn.classList.add('text-gray-400');
                }
            });

            const textChat = document.getElementById('text-chat-area');
            const voiceChat = document.getElementById('voice-chat-area');

            if (type === 'text') {
                textChat.classList.remove('hidden');
                voiceChat.classList.add('hidden');
                document.getElementById('current-channel-name').innerText = name;
                document.getElementById('chat-input').placeholder = `Message #${name}`;
                renderMessages();
                
                // Stop media if leaving voice
                if(micStream) micStream.getTracks().forEach(t => t.stop());
                if(screenStream) screenStream.getTracks().forEach(t => t.stop());
                micStream = null;
                screenStream = null;
                document.getElementById('screen-video').srcObject = null;
                isScreenSharing = false;
                updateMediaUI();
                
            } else if (type === 'voice') {
                textChat.classList.add('hidden');
                voiceChat.classList.remove('hidden');
                document.getElementById('voice-channel-name').innerText = name;
                
                // Request Mic
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => { micStream = stream; isMuted = false; updateMediaUI(); })
                    .catch(err => { showError("Mic access denied or unsupported."); isMuted = true; updateMediaUI(); });
            }
        }

        async function toggleScreenShare() {
            const videoEl = document.getElementById('screen-video');
            const placeholder = document.getElementById('voice-placeholder');
            
            if (isScreenSharing) {
                if(screenStream) screenStream.getTracks().forEach(t => t.stop());
                videoEl.srcObject = null;
                videoEl.classList.add('hidden');
                placeholder.classList.remove('hidden');
                isScreenSharing = false;
            } else {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    videoEl.srcObject = screenStream;
                    videoEl.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    isScreenSharing = true;
                    
                    screenStream.getVideoTracks()[0].onended = () => {
                        toggleScreenShare(); // turn it off if user clicks 'Stop Sharing' in browser UI
                    };
                } catch (e) {
                    showError("Screen share denied by browser/sandbox.");
                }
            }
            updateMediaUI();
        }

        function toggleMic() {
            if (micStream) {
                const track = micStream.getAudioTracks()[0];
                if (track) {
                    track.enabled = !track.enabled;
                    isMuted = !track.enabled;
                }
            } else {
                isMuted = !isMuted;
            }
            updateMediaUI();
        }

        function updateMediaUI() {
            const btnMic = document.getElementById('btn-mic');
            const micIconMini = document.getElementById('mic-icon-mini');
            if(isMuted) {
                if(btnMic) { btnMic.classList.replace('bg-[#313338]', 'bg-white'); btnMic.classList.replace('text-white', 'text-gray-900'); btnMic.innerHTML = '<i class="fas fa-microphone-slash text-xl text-red-500"></i>'; }
                micIconMini.classList.replace('fa-microphone', 'fa-microphone-slash');
                micIconMini.classList.add('text-red-500');
            } else {
                if(btnMic) { btnMic.classList.replace('bg-white', 'bg-[#313338]'); btnMic.classList.replace('text-gray-900', 'text-white'); btnMic.innerHTML = '<i class="fas fa-microphone text-xl"></i>'; }
                micIconMini.classList.replace('fa-microphone-slash', 'fa-microphone');
                micIconMini.classList.remove('text-red-500');
            }

            const btnScreen = document.getElementById('btn-screen');
            if(btnScreen) {
                if(isScreenSharing) {
                    btnScreen.classList.replace('bg-[#313338]', 'bg-indigo-500');
                } else {
                    btnScreen.classList.replace('bg-indigo-500', 'bg-[#313338]');
                }
            }
        }

        function clearCache() {
            try { localStorage.removeItem('html-discord-messages'); } catch (e) {}
            messages = [];
            renderMessages();
        }

        function showError(msg) {
            errorText.innerText = msg;
            errorBanner.classList.remove('hidden');
            setTimeout(hideError, 5000);
        }

        function hideError() {
            errorBanner.classList.add('hidden');
        }
    </script>
</body>
</html>
