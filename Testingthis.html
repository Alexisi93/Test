<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download XRAY</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased selection:bg-zinc-800">

  <!-- Centered Single Download Card (Developer Minimalist Style) -->
  <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-lg shadow-xl overflow-hidden">
    
    <!-- Card Header / Identity -->
    <div class="p-5 border-b border-zinc-800/80 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-zinc-950 border border-zinc-800 rounded-md flex items-center justify-center text-zinc-400">
          <i class="fa-solid fa-file-archive text-sm"></i>
        </div>
        <div>
          <h1 class="font-medium text-zinc-100 text-sm font-mono">cool.zip</h1>
          <p class="text-[11px] text-zinc-500 font-mono">Direct Download</p>
        </div>
      </div>
      <span class="bg-zinc-950 text-zinc-400 border border-zinc-800 text-[11px] px-2 py-0.5 rounded font-mono">
        .ZIP
      </span>
    </div>

    <!-- Details Grid -->
    <div class="p-5 space-y-4">
      <div class="bg-zinc-950 border border-zinc-800/80 rounded-md p-3 text-xs font-mono space-y-2.5">
        
        <!-- Target Path with Copy Button -->
        <div class="flex items-center justify-between">
          <span class="text-zinc-500">TARGET PATH</span>
          <div class="flex items-center space-x-2">
            <span class="text-zinc-300 font-medium">mods/cool.zip</span>
            <button 
              onclick="copyTargetPath()"
              id="copyBtn"
              title="Copy Target Path"
              class="text-zinc-500 hover:text-zinc-200 transition-colors px-1.5 py-0.5 rounded border border-zinc-800 hover:border-zinc-700 bg-zinc-900"
            >
              <i class="fa-regular fa-copy text-[11px]"></i>
            </button>
          </div>
        </div>

        <div class="flex justify-between items-center border-t border-zinc-900 pt-2.5">
          <span class="text-zinc-500">FILE SIZE</span>
          <span class="text-zinc-300">14.2 MB</span>
        </div>

        <div class="flex justify-between items-center border-t border-zinc-900 pt-2.5">
          <span class="text-zinc-500">STATUS</span>
          <span class="text-emerald-400 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
            Ready
          </span>
        </div>
      </div>

      <!-- Action Button -->
      <button 
        id="downloadBtn"
        onclick="handleDownload()" 
        class="w-full bg-zinc-100 hover:bg-white active:bg-zinc-200 text-zinc-900 font-medium text-sm py-2.5 px-4 rounded-md flex items-center justify-center space-x-2 transition-colors cursor-pointer"
      >
        <i class="fa-solid fa-download text-xs"></i>
        <span>Download cool.zip</span>
      </button>
    </div>

    <!-- Minimal Card Footer -->
    <div class="px-5 py-2.5 bg-zinc-950 border-t border-zinc-800/60 flex items-center justify-between text-[11px] text-zinc-500 font-mono">
      <span>HASH: SHA-256 VERIFIED</span>
      <span id="copyStatusText" class="text-zinc-500">CLICK TO DOWNLOAD</span>
    </div>

  </div>

  <script>
    // =========================================================================
    // REPLACABLE DOWNLOAD URL
    // =========================================================================
    const DOWNLOAD_URL = 'https://alexisi93.github.io/Test/Xray_Ultimate_26.X_v5.4.4.zip';
    const TARGET_PATH = 'XRAY.zip';

    function handleDownload() {
      if (!DOWNLOAD_URL) return;
      
      const link = document.createElement('a');
      link.href = DOWNLOAD_URL;
      link.download = 'cool.zip';
      link.target = '_blank';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function copyTargetPath() {
      const textarea = document.createElement('textarea');
      textarea.value = TARGET_PATH;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        const copyBtn = document.getElementById('copyBtn');
        const copyStatusText = document.getElementById('copyStatusText');
        
        copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400 text-[11px]"></i>';
        copyStatusText.textContent = 'PATH COPIED!';
        copyStatusText.classList.add('text-emerald-400');
        
        setTimeout(() => {
          copyBtn.innerHTML = '<i class="fa-regular fa-copy text-[11px]"></i>';
          copyStatusText.textContent = 'CLICK TO DOWNLOAD';
          copyStatusText.classList.remove('text-emerald-400');
        }, 2000);
      } catch (err) {
        console.error('Failed to copy: ', err);
      } finally {
        document.body.removeChild(textarea);
      }
    }
  </script>
</body>
</html>
